  Fictional people only. Nothing here was copied from Instagram and nothing is

  loadHTMLString(html, baseURL: https://www.instagram.com/direct/t/ketchup-test-fixture/).

  It copies the parts of the real page an extractor can rely on, and none it
  can't. Class names are meaningless atomic classes (one CSS declaration each,
  hashed like StyleX), and the only id is the React root. Everything is drawn
  by the script below, the way React draws Instagram:

    #mount_0_0_Ab > div > div > div
      header bar: Back button, 32px avatar, title "Breck Crew 🎿", member names,
                  Audio call / Video call / Conversation information buttons
      div[role=main]
        scroll container (overflow-y: auto)

            div[role=row] > div[role=none] > div[role=gridcell] > div > ...
        composer: div[role=textbox][contenteditable][aria-label=Message] holding a draft

  Rows are time separators, system notices, messages (theirs on the left in gray
  bubbles with a name label over each run and an avatar by its last bubble, mine
  on the right in gradient bubbles), media, a reply, reactions, an edited
  message, a read receipt and a typing indicator.

  Lazy loading works like Instagram's upward infinite scroll: only the newest
  items render at first. When the scroll container comes within 80px of its top
  a progressbar row appears, and 700ms later the next 15 older items are added
  above while the visible messages stay put. A scroll listener and a 200ms poll
  both trigger it, because WebKit throttles hidden pages. After the last batch,
  the thread-start header (avatar, title, "Instagram", "View profile") shows at
  the very top.

  ig-thread-fixture.expected.json is the ground truth for the fully loaded
  thread. It follows THREAD below; change both together.
-->

      if (done) {

        scroller.removeEventListener('scroll', maybeLoadOlder);
      }
    }, 700);
  }

  scroller.addEventListener('scroll', maybeLoadOlder, { passive: true });
  poll = setInterval(maybeLoadOlder, 200);
})();
</script>
