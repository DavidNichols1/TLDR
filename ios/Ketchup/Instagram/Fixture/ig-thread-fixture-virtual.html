  nothing is fetched: every image is an inline SVG or a data: URI. Load it with
  loadHTMLString(html, baseURL: https://www.instagram.com/direct/t/ketchup-test-fixture/).

  Same conversation as ig-thread-fixture.html (people, texts, order, time separators), except
  that the shared post is now a shared reel card and the photo and the video are view-once
  placeholders. Class names are meaningless atomic classes, and there is no [role=main]:

    #mount_0_0_Vt > div
      header:   div[role=button][aria-label="Open the details page of the chat"] holding the Back
                button, a 32px avatar and h2[dir=auto] > span (the title); "Conversation
                information" on the right
      pinned:   a bar with a 14px preview of a pinned message (never to be extracted), Previous
                and Next buttons and a "1/2" counter
      scroller: overflow-y auto, flex-direction column-reverse, so scrollTop is 0 at the bottom
                (newest) and negative going up
        div: the rows, oldest first
          div[role=progressbar] > svg[aria-label="Loading..."], while older messages remain
          row: a div with an explicit height
            message:   div[role=group][tabindex="-1"] > sender label span[dir=auto] (first of a
                       run), avatar link (last of a run, else a 28px spacer),
                       div[role=article] > ... > bubble > span[dir=auto], the hover actions
                       div[role=group][aria-label="Message actions"] (opacity 0), reactions
            separator: span[dir=auto], full width, centered, 12px ("Today 3:41 PM")
            also: notices, an empty 0px row, a read receipt, typing, the thread-start header
      composer: div[role=textbox][contenteditable] > p[dir=auto] holding a draft, an aria-hidden
                "Message..." placeholder, Voice Clip / Add Photo or Video / Choose a GIF or sticker

  Virtualization: a row more than 200px outside the scroller's visible area is an empty
  placeholder. It keeps its measured height (inline style), has opacity 0 and no children. When
  it comes within range its content is built again (new elements, same row element) and the
  opacity goes back to 1; when it leaves the range it is emptied again. A scroll listener (30ms
  after the event, like an IntersectionObserver plus a React commit) and a 100ms poll both
  drive it, so rows fill in within about 50ms of a scroll.

  Lazy loading: only items 45 onward are rows at first. While older ones remain, the
  progressbar sits at the top of the list (the real outline found it there with the view at
  the bottom). When the scroller comes within 80px of its top, 700ms later the next 15 older
  items are added above, and nothing on screen moves (scrollTop counts from the bottom and is
  kept). After the last batch the progressbar gives way to the thread-start header. Without
  overflow-anchor: none on the scroller, WebKit's scroll anchoring holds the progressbar in view
  instead and pushes the visible messages down by the batch's height. ?anchoring=on leaves it
  that way, to test a reader against the jump; whether the real page jumps is not measured.

  document.title is "Instagram • Messages" (the real outline masked it to a nine-letter word,
  not the chat's name). Add ?doctitle=group to the URL for "Breck Crew 🎿 • Messages".

  ig-thread-fixture-virtual.expected.json is the ground truth for the fully loaded thread. It
  follows THREAD below; change both together.
-->

        el('div', B.headText, null, [
          el('h2', B.h2, { dir: 'auto' }, el('span', null, null, TITLE)),
          el('span', B.headSub, { dir: 'auto' })
        ])
      ])),
    el('div', B.icon40, { role: 'button', tabindex: '0' }, icon('Conversation information', ICON.info, 24))
  ]);

  const pinned = el('div', B.pinned, null, [
    el('div', B.pinBtn, { role: 'button', tabindex: '0' }, [
      icon('Pinned message icon', ICON.pin, 16),
      el('span', B.pinSpan, { dir: 'auto' }, el('div', B.pinText, null, PINNED))
    ]),
    el('div', B.pinNav, { role: 'button', 'aria-label': 'Previous pinned message', tabindex: '0' }, icon('Previous pinned message', ICON.up, 16)),
    el('span', B.pinCount, { dir: 'auto' }, ['1', '/', '2']),   // three text nodes, the way React writes {i}/{n}
    el('div', B.pinNav, { role: 'button', 'aria-label': 'Next pinned message', tabindex: '0' }, icon('Next pinned message', ICON.down, 16))
  ]);

  const list = el('div', B.list, null);
  const scroller = el('div', B.scroller, null, list);

  const composer = el('div', B.composer, null,
    el('div', B.composerPill, null,
      el('div', B.composerInner, null, [
        el('div', B.fieldCol, null, [
          el('div', B.field, { role: 'textbox', contenteditable: 'true', tabindex: '0', spellcheck: 'true' },
            el('p', B.fieldP, { dir: 'auto' }, el('span', null, { 'data-lexical-text': 'true' }, DRAFT))),
          el('div', B.placeholderWrap, { 'aria-hidden': 'true' }, el('div', B.placeholder, null, 'Message...'))
        ]),
        el('div', B.icon38, { role: 'button', tabindex: '0' }, icon('Voice Clip', ICON.mic, 24)),
        el('div', B.icon40, { role: 'button', tabindex: '0' }, icon('Add Photo or Video', ICON.photo, 24)),
        el('div', B.icon40, { role: 'button', tabindex: '0' }, icon('Choose a GIF or sticker', ICON.sticker, 24))
      ])));

  const style = document.createElement('style');
  document.head.appendChild(style);
  style.textContent = RULES.join('\n');
  document.getElementById('mount_0_0_Vt').appendChild(el('div', B.app, null, [header, pinned, scroller, composer]));

  // ---------------------------------------------------------------------------
  // Virtualized rows. A row element is made once and kept; only its content
  // comes and goes.
  // ---------------------------------------------------------------------------
  const rows = [];   // oldest first: { el, build, filled }

  function makeRow(build) { return { el: el('div', B.row, null), build: build, filled: false }; }
  function fill(row) { row.el.replaceChildren(row.build()); row.el.style.opacity = ''; row.filled = true; }
  function empty(row) { row.el.replaceChildren(); row.el.style.opacity = '0'; row.filled = false; }
  function itemRow(i) { return makeRow(function () { return itemContent(i); }); }

  // New rows go in filled, so each can be measured; the height is then fixed on the row.
  function addRows(batch, before) {
    batch.forEach(function (row) { list.insertBefore(row.el, before); fill(row); });
    batch.forEach(function (row) { row.el.style.height = row.el.getBoundingClientRect().height + 'px'; });
  }

  function update() {
    const box = scroller.getBoundingClientRect();
    const top = box.top - OVERSCAN;
    const bottom = box.bottom + OVERSCAN;
    for (const row of rows) {
      const r = row.el.getBoundingClientRect();
      const near = r.bottom >= top && r.top <= bottom;
      if (near && !row.filled) fill(row);
      else if (!near && row.filled) empty(row);
    }
    maybeLoadOlder();
  }

  // ---------------------------------------------------------------------------
  // Older messages, at the top
  // ---------------------------------------------------------------------------
  const progress = el('div', B.progress, { role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100' },
    icon('Loading...', ICON.spin, 44, B.spinner));
  let loadedFrom = OLDER;
  let loading = false;
  let done = false;

  function maybeLoadOlder() {
    if (loading || done) return;
    if (scroller.scrollTop > -(scroller.scrollHeight - scroller.clientHeight) + NEAR_TOP) return;
    loading = true;
    setTimeout(function () {
      const from = Math.max(0, loadedFrom - BATCH);
      const batch = [];
      for (let i = from; i < loadedFrom; i++) batch.push(itemRow(i));
      loadedFrom = from;
      if (from === 0) {
        batch.unshift(makeRow(threadStartContent));
        done = true;
      }
      // scrollTop counts from the bottom here, so keeping it keeps the view where it was. It is
      // read before anything changes, and the progressbar goes only after the new rows are in,
      // so the list never shrinks under a view that sits at the very top.
      const keep = scroller.scrollTop;
      addRows(batch, rows[0].el);
      if (done) progress.remove();
      if (!ANCHORING && scroller.scrollTop !== keep) scroller.scrollTop = keep;
      rows.unshift.apply(rows, batch);
      loading = false;
      update();
    }, LOAD_MS);
  }

  // The newest items, as rows, at the bottom of the list (scrollTop 0).
  list.appendChild(progress);
  const firstRows = [];
  for (let i = OLDER; i < THREAD.length; i++) firstRows.push(itemRow(i));
  firstRows.push(makeRow(receiptContent));
  firstRows.push(makeRow(typingContent));
  addRows(firstRows, null);
  rows.push.apply(rows, firstRows);
  update();

  let pending = 0;
  scroller.addEventListener('scroll', function () {
    if (!pending) pending = setTimeout(function () { pending = 0; update(); }, MOUNT_MS);
  }, { passive: true });
  setInterval(update, POLL_MS);
})();
</script>
</body>
</html>
